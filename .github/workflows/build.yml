name: Build Unsigned IPA for TaskPortHaxxApp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    # 不再运行 make！直接跳过
    # - name: Install dependencies
    #   run: make  # ← 删除这一步

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: List project files
      run: |
        echo "Listing project files..."
        ls -la *.xcodeproj *.xcworkspace 2>/dev/null || echo "No .xcodeproj or .xcworkspace found"
        ls -la

    - name: Build Archive (No Signing)
      run: |
        # 自动查找 .xcodeproj 文件
        PROJECT_FILE=$(ls *.xcodeproj | head -n1)
        if [ -z "$PROJECT_FILE" ]; then
          echo "Error: No .xcodeproj found!"
          exit 1
        fi
        echo "Using project: $PROJECT_FILE"

        # 自动查找 Scheme（从项目中提取）
        SCHEME=$(xcodebuild -list -project "$PROJECT_FILE" | grep -A 100 "Schemes:" | tail -n +2 | head -1 | xargs)
        if [ -z "$SCHEME" ]; then
          echo "Error: No scheme found!"
          exit 1
        fi
        echo "Using scheme: $SCHEME"

        # 构建 Archive（禁用签名）
        xcodebuild archive \
          -project "$PROJECT_FILE" \
          -scheme "$SCHEME" \
          -configuration Release \
          -archivePath build/TaskPortHaxxApp.xcarchive \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -quiet || exit 1

    - name: Export Unsigned IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/TaskPortHaxxApp.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates \
          -quiet

        # 重命名 IPA 为固定名称
        mv build/*.ipa build/TaskPortHaxxApp-unsigned.ipa || exit 1

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: build/TaskPortHaxxApp-unsigned.ipa
        retention-days: 30
