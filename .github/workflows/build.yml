name: Build Unsigned IPA for TaskPortHaxxApp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Find Xcode project
      id: findproj
      run: |
        # 递归查找 .xcodeproj 目录（可能在子目录）
        PROJ_DIR=$(find . -type d -name "*.xcodeproj" | head -n1)
        if [ -z "$PROJ_DIR" ]; then
          echo "Error: No .xcodeproj directory found!"
          exit 1
        fi
        echo "Found project directory: $PROJ_DIR"
        echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

        # 取出项目名（去掉 .xcodeproj 后缀）
        PROJ_NAME=$(basename "$PROJ_DIR" .xcodeproj)
        echo "proj_name=$PROJ_NAME" >> $GITHUB_OUTPUT

    - name: List schemes
      run: |
        xcodebuild -list -project "${{ steps.findproj.outputs.proj_dir }}"

    - name: Pick first scheme
      id: scheme
      run: |
        # 提取 Schemes 列表的第一项（通常是 App 的名字）
        SCHEME=$(xcodebuild -list -project "${{ steps.findproj.outputs.proj_dir }}" \
          | sed -n '/Schemes:/,/^[[:space:]]*$/p' \
          | tail -n +2 | head -n1 | xargs)
        if [ -z "$SCHEME" ]; then
          echo "Error: No scheme found!"
          exit 1
        fi
        echo "Using scheme: $SCHEME"
        echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

    - name: Build Archive (No Signing)
      run: |
        mkdir -p build

        xcodebuild archive \
          -project "${{ steps.findproj.outputs.proj_dir }}" \
          -scheme "${{ steps.scheme.outputs.scheme }}" \
          -configuration Release \
          -archivePath build/TaskPortHaxxApp.xcarchive \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -quiet

    - name: Export Unsigned IPA
      run: |
        xcodebuild -exportArchive \
          -archivePath build/TaskPortHaxxApp.xcarchive \
          -exportOptionsPlist exportOptions.plist \
          -exportPath build \
          -allowProvisioningUpdates \
          -quiet

        # 统一命名
        mv build/*.ipa build/TaskPortHaxxApp-unsigned.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: build/TaskPortHaxxApp-unsigned.ipa
        retention-days: 30
