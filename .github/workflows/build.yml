name: Build TaskPortHaxxApp Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      PROJECT_NAME: TaskPortHaxxApp
      TARGET_NAME: TaskPortHaxxApp
      SCHEME_NAME: TaskPortHaxxApp
      CONFIGURATION: Release
      BUILD_DIR: build
      EXPORT_DIR: export
      IPA_NAME: TaskPortHaxxApp.ipa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Ruby gem xcodeproj
        run: |
          sudo gem install xcodeproj

      - name: Add troller.c to Compile Sources
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          proj_path = "#{ENV['PROJECT_NAME']}.xcodeproj"
          target_name = ENV['TARGET_NAME']
          file_path = "#{ENV['PROJECT_NAME']}/troller.c"

          unless File.exist?(proj_path)
            puts "ERROR: #{proj_path} does not exist!"
            exit 1
          end

          project = Xcodeproj::Project.open(proj_path)
          target = project.targets.find { |t| t.name == target_name }
          raise "Target '#{target_name}' not found" unless target

          file_ref = project.files.find { |f| f.path == file_path }
          file_ref ||= project.new_file(file_path)

          unless target.source_build_phase.files.any? { |sf| sf.file_ref == file_ref }
            target.source_build_phase.add_file_reference(file_ref)
            project.save
            puts "Added troller.c to Compile Sources for target #{target_name}"
          else
            puts "troller.c is already in Compile Sources"
          end
          RUBY

      - name: Build unsigned IPA
        run: |
          mkdir -p $BUILD_DIR
          xcodebuild -project "${PROJECT_NAME}.xcodeproj" \
                     -scheme "$SCHEME_NAME" \
                     -configuration "$CONFIGURATION" \
                     -sdk iphoneos \
                     -derivedDataPath $BUILD_DIR \
                     clean build \
                     CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package unsigned IPA
        run: |
          mkdir -p $EXPORT_DIR/Payload
          cp -R "$BUILD_DIR/Build/Products/${CONFIGURATION}-iphoneos/${TARGET_NAME}.app" "$EXPORT_DIR/Payload/"
          cd $EXPORT_DIR
          zip -r "../$IPA_NAME" Payload
          cd ..
          echo "Unsigned IPA created: $IPA_NAME"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPortHaxxApp-unsigned
          path: $IPA_NAME
