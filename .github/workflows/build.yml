name: Build TaskPortHaxxApp Unsigned IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      PROJECT_NAME: TaskPortHaxxApp
      TARGET_NAME: TaskPortHaxxApp
      SCHEME_NAME: TaskPortHaxxApp
      CONFIGURATION: Release
      BUILD_DIR: build
      EXPORT_DIR: export
      IPA_NAME: TaskPortHaxxApp.ipa

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      - name: Build unsigned app with extra troller.c
        run: |
          mkdir -p $BUILD_DIR
          # 直接在 xcodebuild 命令中编译 troller.c
          xcodebuild -project "${PROJECT_NAME}.xcodeproj" \
                     -scheme "$SCHEME_NAME" \
                     -configuration "$CONFIGURATION" \
                     -sdk iphoneos \
                     -derivedDataPath $BUILD_DIR \
                     clean build \
                     CODE_SIGN_IDENTITY="" \
                     CODE_SIGNING_REQUIRED=NO \
                     OTHER_CFLAGS="-include $(pwd)/${PROJECT_NAME}/troller.c"

      - name: Package unsigned IPA
        run: |
          mkdir -p $EXPORT_DIR/Payload
          cp -R "$BUILD_DIR/Build/Products/${CONFIGURATION}-iphoneos/${TARGET_NAME}.app" "$EXPORT_DIR/Payload/"
          cd $EXPORT_DIR
          zip -r "../$IPA_NAME" Payload
          cd ..
          echo "Unsigned IPA created: $IPA_NAME"

      - name: Upload IPA as artifact
        uses: actions/upload-artifact@v3
        with:
          name: TaskPortHaxxApp-unsigned
          path: $IPA_NAME
