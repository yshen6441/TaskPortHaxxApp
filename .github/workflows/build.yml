name: Build Unsigned IPA for TaskPortHaxxApp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Find Xcode project
      id: findproj
      run: |
        PROJ_DIR=$(find . -type d -name "*.xcodeproj" | head -n1)
        if [ -z "$PROJ_DIR" ]; then
          echo "Error: No .xcodeproj found!"
          exit 1
        fi
        echo "Found project: $PROJ_DIR"
        echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

    - name: Pick first scheme
      id: scheme
      run: |
        SCHEME=$(xcodebuild -list -project "${{ steps.findproj.outputs.proj_dir }}" \
          | sed -n '/Schemes:/,/^[[:space:]]*$/p' \
          | tail -n +2 | head -n1 | xargs)
        if [ -z "$SCHEME" ]; then
          echo "Error: No scheme found!"
          exit 1
        fi
        echo "Using scheme: $SCHEME"
        echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

    - name: Build Archive (No Signing)
      run: |
        mkdir -p build
        xcodebuild archive \
          -project "${{ steps.findproj.outputs.proj_dir }}" \
          -scheme "${{ steps.scheme.outputs.scheme }}" \
          -configuration Release \
          -archivePath build/TaskPortHaxxApp.xcarchive \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -quiet \
          || exit 1

    - name: Locate .app bundle
      id: app
      run: |
        # 全局搜索 .app 目录
        APP_PATH=$(find build -type d -name "*.app" | head -n1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app bundle found in build output!"
          echo "Listing build directory:"
          ls -la build
          echo "Listing archive:"
          ls -la build/TaskPortHaxxApp.xcarchive || true
          exit 1
        fi
        echo "Found .app: $APP_PATH"
        echo "app_path=$APP_PATH" >> $GITHUB_OUTPUT

    - name: Create Payload and Package IPA
      run: |
        PAYLOAD="build/Payload"
        mkdir -p "$PAYLOAD"
        
        # 复制 .app
        cp -r "${{ steps.app.outputs.app_path }}" "$PAYLOAD/"
        
        # 打包 IPA
        cd build
        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload/*
        cd ..
        
        # 验证
        echo "IPA created:"
        ls -la build/TaskPortHaxxApp-unsigned.ipa

    - name: Upload Unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: build/TaskPortHaxxApp-unsigned.ipa
        retention-days: 30
