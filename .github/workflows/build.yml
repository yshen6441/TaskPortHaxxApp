name: Build TaskPortHaxxApp

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    env:
      PROJECT_NAME: TaskPortHaxxApp
      TARGET_NAME: TaskPortHaxxApp
      SCHEME_NAME: TaskPortHaxxApp
      CONFIGURATION: Release
      BUILD_DIR: build
      EXPORT_DIR: export
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Install Ruby gem xcodeproj
        run: |
          sudo gem install xcodeproj

      - name: Add troller.c to Compile Sources
        run: |
          ruby <<'RUBY'
          require 'xcodeproj'
          proj_path = "#{ENV['PROJECT_NAME']}.xcodeproj"
          target_name = ENV['TARGET_NAME']
          file_path = "#{ENV['PROJECT_NAME']}/troller.c"
          project = Xcodeproj::Project.open(proj_path)
          target = project.targets.find { |t| t.name == target_name }
          raise "Target '#{target_name}' not found" unless target
          file_ref = project.files.find { |f| f.path == file_path }
          file_ref ||= project.new_file(file_path)
          target.source_build_phase.add_file_reference(file_ref) unless target.source_build_phase.files.any? { |sf| sf.file_ref == file_ref }
          project.save
          puts "troller.c added to Compile Sources"
          RUBY

      - name: Build unsigned IPA
        run: |
          mkdir -p $BUILD_DIR
          xcodebuild -scheme "$SCHEME_NAME" \
                     -configuration "$CONFIGURATION" \
                     -workspace "${PROJECT_NAME}.xcworkspace" \
                     -sdk iphoneos \
                     -derivedDataPath $BUILD_DIR \
                     build \
                     CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

          mkdir -p $EXPORT_DIR
          cp -R "$BUILD_DIR/Build/Products/${CONFIGURATION}-iphoneos/${TARGET_NAME}.app" "$EXPORT_DIR/"

      - name: List exported app
        run: |
          ls -l $EXPORT_DIR
