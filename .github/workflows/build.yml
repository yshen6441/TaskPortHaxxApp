name: Build Unsigned IPA for TaskPortHaxxApp

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Find Xcode project
      id: findproj
      run: |
        PROJ_DIR=$(find . -type d -name "*.xcodeproj" | head -n1)
        if [ -z "$PROJ_DIR" ]; then
          echo "Error: No .xcodeproj found!"
          exit 1
        fi
        echo "Found project: $PROJ_DIR"
        echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

    - name: Pick first scheme
      id: scheme
      run: |
        SCHEME=$(xcodebuild -list -project "${{ steps.findproj.outputs.proj_dir }}" \
          | sed -n '/Schemes:/,/^[[:space:]]*$/p' \
          | tail -n +2 | head -n1 | xargs)
        if [ -z "$SCHEME" ]; then
          echo "Error: No scheme found!"
          exit 1
        fi
        echo "Using scheme: $SCHEME"
        echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

    - name: Build Executable (No Signing)
      run: |
        mkdir -p build
        xcodebuild \
          -project "${{ steps.findproj.outputs.proj_dir }}" \
          -scheme "${{ steps.scheme.outputs.scheme }}" \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -quiet \
          build

    - name: Locate Mach-O Executable
      id: binary
      run: |
        # 查找编译出的可执行文件（通常在 build/Release-iphoneos/）
        BINARY=$(find build -type f -perm +111 -size +10k 2>/dev/null | head -n1)
        if [ -z "$BINARY" ]; then
          echo "Error: No executable found!"
          ls -la build || true
          exit 1
        fi
        echo "Found binary: $BINARY"
        file "$BINARY"
        echo "binary_path=$BINARY" >> $GITHUB_OUTPUT

    - name: Create Minimal IPA Structure
      run: |
        APP_NAME="TaskPortHaxxApp"
        PAYLOAD="build/Payload"
        APP_DIR="$PAYLOAD/$APP_NAME.app"
        
        mkdir -p "$APP_DIR"
        
        # 复制二进制
        cp "${{ steps.binary.outputs.binary_path }}" "$APP_DIR/$APP_NAME"
        
        # 创建最小 Info.plist
        cat > "$APP_DIR/Info.plist" << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key>
    <string>TaskPortHaxxApp</string>
    <key>CFBundleIdentifier</key>
    <string>com.yshen6441.taskporthaxx</string>
    <key>CFBundleName</key>
    <string>TaskPortHaxxApp</string>
    <key>CFBundleVersion</key>
    <string>1</string>
    <key>CFBundleShortVersionString</key>
    <string>1.0</string>
    <key>DTPlatformName</key>
    <string>iphoneos</string>
    <key>MinimumOSVersion</key>
    <string>12.0</string>
</dict>
</plist>
EOF

        # 打包 IPA
        cd build
        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload/*
        cd ..

    - name: Upload Unsigned IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: build/TaskPortHaxxApp-unsigned.ipa
        retention-days: 30
