name: Build Unsigned IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
        xcodebuild -version

    - name: Build .app (No Signing)
      run: |
        DERIVED_DATA="build/DerivedData"
        mkdir -p "$DERIVED_DATA"
        
        xcodebuild build \
          -project TaskPortHaxxApp.xcodeproj \
          -scheme TaskPortHaxxApp \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath "$DERIVED_DATA" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -destination 'generic/platform=iOS' \
          -quiet

    - name: Create Unsigned IPA
      run: |
        APP_PATH=$(find build/DerivedData -name "*.app" -type d | head -n1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app found!"
          exit 1
        fi
        
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/TaskPortHaxxApp.app
        
        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: TaskPortHaxxApp-unsigned.ipa
        retention-days: 30
