name: Build TaskPortHaxxApp for TrollStore

on:
  push:
    branches: [ pacbf ]
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ✅ 修复 troller.m 被错误放入 Resources 的问题
      - name: Fix troller.m build phase
        run: |
          echo "🔧 Fixing Xcode project for troller.m ..."
          sed -i '' '/troller.m in Resources/d' TaskPortHaxxApp.xcodeproj/project.pbxproj || true
          sed -i '' '/troller.m/d' TaskPortHaxxApp.xcodeproj/project.pbxproj || true

      # ✅ 指定 Xcode 版本
      - name: Select Xcode version
        run: sudo xcode-select -s "/Applications/Xcode_16.1.app"

      # ✅ 下载 Darwin 头文件修复 bootstrap.h 缺失
      - name: Add missing Darwin headers
        run: |
          echo "📥 Downloading Darwin mach headers..."
          mkdir -p headers/mach
          curl -s -o headers/mach/bootstrap.h https://raw.githubusercontent.com/apple-oss-distributions/xnu/main/osfmk/mach/bootstrap.h
          curl -s -o headers/mach/mach_init.h https://raw.githubusercontent.com/apple-oss-distributions/xnu/main/osfmk/mach/mach_init.h
          curl -s -o headers/mach/mach_port.h https://raw.githubusercontent.com/apple-oss-distributions/xnu/main/osfmk/mach/mach_port.h
          echo "✅ Headers ready: $(ls headers/mach)"

      # ✅ 构建 TrollStore 可侧载的 iOS App（无签名）
      - name: Build TaskPortHaxxApp (iOS)
        run: |
          echo "🚀 Starting build for TrollStore..."
          xcodebuild \
            -project TaskPortHaxxApp.xcodeproj \
            -scheme TaskPortHaxxApp \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            SYMROOT=$(pwd)/build \
            build \
            HEADER_SEARCH_PATHS="$(pwd)/headers" \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            | tee xcodebuild.log | xcpretty

          echo "📂 Build output:"
          find build -type d -name "*.app"  # 检查 .app 文件是否存在

      # ✅ 打包为 TrollStore 可安装的 .ipa
      - name: Package .ipa
        run: |
          echo "📦 Packaging IPA..."
          mkdir -p Payload
          APP_PATH=$(find build -type d -name "TaskPortHaxxApp.app" | head -n 1)
          
          # 如果没有找到 .app 文件，打印日志并终止构建
          if [ -z "$APP_PATH" ]; then
            echo "❌ Error: .app not found!"
            echo "Build log:"
            tail -n 50 xcodebuild.log
            exit 1
          fi

          cp -r "$APP_PATH" Payload/  # 将 .app 拷贝到 Payload 目录
          zip -r TaskPortHaxxApp.ipa Payload > /dev/null  # 打包 .ipa
          rm -rf Payload  # 删除临时 Payload 文件夹
          echo "✅ IPA packaged successfully: TaskPortHaxxApp.ipa"

      # ✅ 上传 .ipa 和日志
      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPortHaxxApp
          path: |
            TaskPortHaxxApp.ipa
            xcodebuild.log
