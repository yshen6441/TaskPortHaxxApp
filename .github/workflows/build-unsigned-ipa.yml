name: Build Unsigned IPA (Manual clang + SDK)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos SDK
      run: |
        # 下载 Theos SDKs
        curl -L https://github.com/theos/sdks/archive/master.tar.gz -o sdks.tar.gz
        mkdir -p sdks
        tar -xzf sdks.tar.gz -C sdks --strip-components=1
        # 找最新 iOS SDK
        SDK_DIR=$(ls sdks | grep iPhoneOS | sort -V | tail -n1)
        echo "Using SDK: $SDK_DIR"
        echo "SDK_PATH=$(pwd)/sdks/$SDK_DIR" >> $GITHUB_ENV

    - name: Compile All .m Files
      run: |
        # 启用模块支持（解决 @import 错误）
        clang -arch arm64 \
          -isysroot "$SDK_PATH" \
          -miphoneos-version-min=12.0 \
          -fmodules \
          -fobjc-arc \
          -framework UIKit \
          -framework Foundation \
          -framework CoreFoundation \
          -I TaskPortHaxxApp \
          -o TaskPortHaxxApp \
          TaskPortHaxxApp/*.m \
          || exit 1

        # 验证 Mach-O
        file TaskPortHaxxApp
        otool -L TaskPortHaxxApp | head -10

    - name: Create Minimal IPA
      run: |
        mkdir -p Payload/TaskPortHaxxApp.app
        cp TaskPortHaxxApp Payload/TaskPortHaxxApp.app/

        # 使用原 Info.plist
        cp TaskPortHaxxApp/Info.plist Payload/TaskPortHaxxApp.app/

        # 强制设置可执行名
        plutil -replace CFBundleExecutable -string TaskPortHaxxApp Payload/TaskPortHaxxApp.app/Info.plist

        # 打包
        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload

        echo "IPA created:"
        ls -la TaskPortHaxxApp-unsigned.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: TaskPortHaxxApp-unsigned.ipa
