name: Build TaskPortHaxxApp (Theos)

on:
  push:
    branches: [ pacbf ]
  pull_request:

jobs:
  build:
    runs-on: macos-latest
    env:
      THEOS: /opt/theos

    steps:
      - name: 🧱 Checkout source
        uses: actions/checkout@v4

      - name: 🧰 Install Theos dependencies
        run: |
          brew install ldid make perl wget dpkg
          sudo git clone --recursive https://github.com/theos/theos.git /opt/theos

      - name: 🔧 Setup SDK (iPhone 16.5)
        run: |
          sudo mkdir -p $THEOS/sdks
          wget -q https://github.com/theos/sdks/archive/refs/heads/master.zip -O /tmp/sdks.zip
          unzip -q /tmp/sdks.zip -d /tmp/
          sudo mv /tmp/sdks-master/*.sdk $THEOS/sdks/ || true
          ls -l $THEOS/sdks
          echo "✅ SDKs installed successfully in $THEOS/sdks"

      - name: 🚀 Build IPA (TrollStore Compatible)
        run: |
          echo "🏗️ Building with Theos..."
          make clean
          make package FINALPACKAGE=1
          echo "✅ Build complete"
          ls -R packages

      - name: ☁️ Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: TaskPortHaxxApp-IPA
          path: packages/*.ipa
