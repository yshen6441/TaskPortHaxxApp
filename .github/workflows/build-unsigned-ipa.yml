name: Build TaskPortHaxxApp

on:
  push:
    branches: [ pacbf ]
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      # ✅ 修复 project.pbxproj 中错误的 troller.m 配置（移出 Resources 阶段）
      - name: Fix troller.m build phase
        run: |
          sed -i '' '/troller.m in Resources/d' TaskPortHaxxApp.xcodeproj/project.pbxproj
          sed -i '' '/troller.m/d' TaskPortHaxxApp.xcodeproj/project.pbxproj

      - name: Select Xcode version
        run: sudo xcode-select -s "/Applications/Xcode_16.1.app"

      - name: Build TaskPortHaxxApp
        run: |
          xcodebuild \
            -project TaskPortHaxxApp.xcodeproj \
            -scheme TaskPortHaxxApp \
            -configuration Release \
            -sdk iphoneos \
            build \
            CODE_SIGN_IDENTITY="" \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGNING_ALLOWED=NO \
            ONLY_ACTIVE_ARCH=NO \
            ENABLE_BITCODE=NO \
            COMPILER_INDEX_STORE_ENABLE=NO \
            -quiet

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/TaskPortHaxxApp.app Payload/
          zip -r TaskPortHaxxApp.ipa Payload
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPortHaxxApp
          path: TaskPortHaxxApp.ipa
