name: Build Unsigned IPA (Manual clang)

on:
  push:
    branches: [ main, master ]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install iOS SDK
      run: |
        curl -L -o sdk.tar.xz https://github.com/theos/sdks/archive/master.tar.gz
        mkdir -p sdk
        tar -xf sdk.tar.xz -C sdk --strip-components=1
        echo "SDK_PATH=$(pwd)/sdk/iPhoneOS17.5.sdk" >> $GITHUB_ENV

    - name: Compile with clang
      run: |
        clang -arch arm64 \
          -isysroot "$SDK_PATH" \
          -miphoneos-version-min=12.0 \
          -framework UIKit -framework Foundation \
          -o TaskPortHaxxApp \
          TaskPortHaxxApp/*.m \
          -I TaskPortHaxxApp \
          -F "$SDK_PATH/System/Library/Frameworks" \
          -F "$SDK_PATH/System/Library/PrivateFrameworks" \
          || exit 1

        # 验证
        file TaskPortHaxxApp
        otool -L TaskPortHaxxApp

    - name: Create IPA
      run: |
        mkdir -p Payload/TaskPortHaxxApp.app
        cp TaskPortHaxxApp Payload/TaskPortHaxxApp.app/

        # 复制原始 Info.plist（关键！）
        cp TaskPortHaxxApp/Info.plist Payload/TaskPortHaxxApp.app/

        # 确保可执行名一致
        plutil -replace CFBundleExecutable -string TaskPortHaxxApp Payload/TaskPortHaxxApp.app/Info.plist

        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: TaskPortHaxxApp-unsigned.ipa
