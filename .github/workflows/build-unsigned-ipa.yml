name: Build Unsigned IPA

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Select Xcode
      run: |
        sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
        xcodebuild -version

    - name: Find .xcodeproj
      id: proj
      run: |
        PROJ=$(find . -name "*.xcodeproj" -type d | head -n1)
        if [ -z "$PROJ" ]; then
          echo "Error: No .xcodeproj found!"
          exit 1
        fi
        echo "Found project: $PROJ"
        echo "project=$PROJ" >> $GITHUB_OUTPUT

    - name: Get Scheme
      id: scheme
      run: |
        SCHEME=$(xcodebuild -list -project "$PROJ" | \
          awk '/Schemes:/,/^$/ {if(NR>1) print}' | head -1 | xargs)
        if [ -z "$SCHEME" ]; then
          echo "Error: No scheme found!"
          exit 1
        fi
        echo "Using scheme: $SCHEME"
        echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

    - name: Build Binary
      run: |
        xcodebuild \
          -project "$PROJ" \
          -scheme "$SCHEME" \
          -configuration Release \
          -sdk iphoneos \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -quiet \
          build

    - name: Find Executable
      id: bin
      run: |
        BIN=$(find build -type f -perm +111 -size +10k 2>/dev/null | head -n1)
        if [ -z "$BIN" ]; then
          echo "Error: No binary found!"
          ls -la build || true
          exit 1
        fi
        echo "Found binary: $BIN"
        echo "path=$BIN" >> $GITHUB_OUTPUT

    - name: Create IPA
      run: |
        mkdir -p build/Payload/TaskPortHaxxApp.app
        cp "$BIN" build/Payload/TaskPortHaxxApp.app/TaskPortHaxxApp

        cat > build/Payload/TaskPortHaxxApp.app/Info.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key><string>TaskPortHaxxApp</string>
    <key>CFBundleIdentifier</key><string>com.yshen6441.taskporthaxx</string>
    <key>CFBundleName</key><string>TaskPortHaxxApp</string>
    <key>CFBundleVersion</key><string>1</string>
    <key>CFBundleShortVersionString</key><string>1.0</string>
    <key>DTPlatformName</key><string>iphoneos</string>
    <key>MinimumOSVersion</key><string>12.0</string>
</dict>
</plist>
EOF

        cd build
        zip -r9 ../TaskPortHaxxApp-unsigned.ipa Payload
        cd ..
        ls -la TaskPortHaxxApp-unsigned.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: TaskPortHaxxApp-unsigned.ipa
