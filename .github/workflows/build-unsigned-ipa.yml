name: Build Unsigned IPA with Theos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
    - name: Checkout
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Install SDK
      run: |
        curl -L https://github.com/theos/sdks/archive/master.tar.gz -o sdks.tar.gz
        tar -xzf sdks.tar.gz -C $THEOS/sdks
        mv $THEOS/sdks/sdks-master/iPhoneOS17.0.sdk $THEOS/sdks/  # 调整版本

    - name: Build with Theos
      run: |
        make package FINALPACKAGE=1

    - name: Create Unsigned IPA
      run: |
        DEB=$(find packages -name "*.deb" | head -n1)
        dpkg-deb -x "$DEB" extract
        APP_PATH=$(find extract -name "*.app" -type d | head -1)
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: TaskPortHaxxApp-unsigned.ipa
