name: Build Unsigned IPA (Xcode Fixed)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Select Xcode 16
      run: |
        sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
        xcodebuild -version

    - name: Find .xcodeproj
      id: proj
      run: |
        PROJ_DIR=$(find . -type d -name "*.xcodeproj" | head -n1)
        if [ -z "$PROJ_DIR" ]; then
          echo "Error: No .xcodeproj!"
          exit 1
        fi
        echo "Found: $PROJ_DIR"
        echo "proj_dir=$PROJ_DIR" >> $GITHUB_OUTPUT

    - name: List Schemes
      run: |
        xcodebuild -list -project "${{ steps.proj.outputs.proj_dir }}"

    - name: Get Scheme
      id: scheme
      run: |
        SCHEME=$(xcodebuild -list -project "${{ steps.proj.outputs.proj_dir }}" | \
          grep -A 100 "Schemes:" | tail -n +2 | head -1 | xargs)
        if [ -z "$SCHEME" ]; then
          echo "Error: No scheme! Default to TaskPortHaxxApp"
          SCHEME="TaskPortHaxxApp"
        fi
        echo "Using scheme: $SCHEME"
        echo "scheme=$SCHEME" >> $GITHUB_OUTPUT

    - name: Build .app (No Signing, Fixed Paths)
      run: |
        DERIVED_DATA="build/DerivedData"
        mkdir -p "$DERIVED_DATA"
        
        xcodebuild build-for-testing \
          -project "${{ steps.proj.outputs.proj_dir }}" \
          -scheme "${{ steps.scheme.outputs.scheme }}" \
          -configuration Release \
          -sdk iphoneos \
          -derivedDataPath "$DERIVED_DATA" \
          CODE_SIGNING_ALLOWED=NO \
          CODE_SIGN_IDENTITY="" \
          PROVISIONING_PROFILE="" \
          DEVELOPMENT_TEAM="" \
          -destination 'generic/platform=iOS' \
          -quiet || exit 1

        # 查找 .app（固定路径）
        APP_PATH=$(find "$DERIVED_DATA" -name "*.app" -type d | head -n1)
        if [ -z "$APP_PATH" ]; then
          echo "Error: No .app found! Listing DerivedData:"
          find "$DERIVED_DATA" -name "*.app" || ls -la "$DERIVED_DATA"
          exit 1
        fi
        echo "Found .app: $APP_PATH"
        cp -r "$APP_PATH" build/TaskPortHaxxApp.app

    - name: Create Unsigned IPA
      run: |
        mkdir -p build/Payload
        cp -r build/TaskPortHaxxApp.app build/Payload/
        
        cd build
        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload
        cd ..
        
        echo "IPA created:"
        ls -la build/TaskPortHaxxApp-unsigned.ipa

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: build/TaskPortHaxxApp-unsigned.ipa
        retention-days: 30
