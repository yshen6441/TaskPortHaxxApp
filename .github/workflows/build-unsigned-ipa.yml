name: Build Unsigned IPA with Theos

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Homebrew
      run: /bin/bash -c "$(curl -fsSL https://raw.githubusercontent.com/Homebrew/install/HEAD/install.sh)"

    - name: Install GNU Make
      run: brew install make

    - name: Set PATH for GNU Make
      run: echo "PATH=$(brew --prefix make)/libexec/gnubin:$PATH" >> $GITHUB_ENV

    - name: Install Theos
      run: |
        git clone https://github.com/theos/theos.git $HOME/theos
        cd $HOME/theos
        git submodule update --init --recursive
        cd -
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Update Theos (Install Vendor)
      run: $THEOS/bin/update-theos

    - name: Install SDK
      run: |
        curl -L https://github.com/theos/sdks/archive/master.tar.gz -o sdks.tar.gz
        tar -xzf sdks.tar.gz -C $THEOS/sdks --strip-components=1
        rm sdks.tar.gz

    - name: Select Xcode
      run: sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer

    - name: Build with Makefile
      run: |
        make clean
        make package FINALPACKAGE=1 CODE_SIGN_IDENTITY="" || exit 1

    - name: Create Unsigned IPA
      run: |
        DEB=$(find packages -name "*.deb" | head -n1)
        if [ -z "$DEB" ]; then
          echo "Error: No .deb found!"
          ls -la packages
          exit 1
        fi
        dpkg-deb -x "$DEB" extract
        APP_PATH=$(find extract -name "*.app" -type d | head -n1)
        mkdir -p Payload
        cp -r "$APP_PATH" Payload/
        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload

    - name: Upload IPA Artifact
      uses: actions/upload-artifact@v4
      with:
        name: unsigned-ipa
        path: TaskPortHaxxApp-unsigned.ipa
        retention-days: 30
