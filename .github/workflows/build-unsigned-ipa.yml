name: Build Unsigned IPA (Theos)

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    timeout-minutes: 60

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Install Theos
      run: |
        git clone --depth 1 https://github.com/theos/theos.git $HOME/theos
        echo "THEOS=$HOME/theos" >> $GITHUB_ENV
        echo "$HOME/theos/bin" >> $GITHUB_PATH

    - name: Install iOS SDK
      run: |
        curl -L -o ios.sdk.tar.xz https://github.com/theos/sdks/archive/master.tar.gz
        tar -xJf ios.sdk.tar.xz -C $THEOS/sdks
        mv $THEOS/sdks/sdks-master/*.sdk $THEOS/sdks/
        rm -rf $THEOS/sdks/sdks-master ios.sdk.tar.xz

    - name: Build with Theos
      run: |
        make package FINALPACKAGE=1 || exit 1

    - name: Find DEB
      id: deb
      run: |
        DEB=$(find ./packages -name "*.deb" | head -n1)
        if [ -z "$DEB" ]; then
          echo "Error: No .deb found!"
          ls -la ./packages || true
          exit 1
        fi
        echo "Found DEB: $DEB"
        echo "deb_path=$DEB" >> $GITHUB_OUTPUT

    - name: Extract Binary from DEB
      run: |
        mkdir -p extract
        dpkg-deb -x "${{ steps.deb.outputs.deb_path }}" extract

        # 查找主二进制（通常在 /Applications/xxx.app/ 或 /usr/bin/）
        BINARY=$(find extract -type f -perm +111 -size +10k | head -n1)
        if [ -z "$BINARY" ]; then
          echo "Error: No binary in DEB!"
          find extract -type f -perm +111
          exit 1
        fi
        echo "Found binary: $BINARY"
        cp "$BINARY" ./TaskPortHaxxApp

    - name: Create Minimal IPA
      run: |
        mkdir -p Payload/TaskPortHaxxApp.app
        cp TaskPortHaxxApp Payload/TaskPortHaxxApp.app/

        cat > Payload/TaskPortHaxxApp.app/Info.plist << 'EOF'
<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
<plist version="1.0">
<dict>
    <key>CFBundleExecutable</key><string>TaskPortHaxxApp</string>
    <key>CFBundleIdentifier</key><string>com.yshen6441.taskporthaxx</string>
    <key>CFBundleName</key><string>TaskPortHaxxApp</string>
    <key>CFBundleVersion</key><string>1</string>
    <key>CFBundleShortVersionString</key><string>1.0</string>
    <key>DTPlatformName</key><string>iphoneos</string>
    <key>MinimumOSVersion</key><string>12.0</string>
    <key>UISupportedDevices</key>
    <array><string>iPhone</string></array>
</dict>
</plist>
EOF

        zip -r9 TaskPortHaxxApp-unsigned.ipa Payload

    - name: Upload IPA
      uses: actions/upload-artifact@v4
      with:
        name: TaskPortHaxxApp-unsigned-ipa
        path: TaskPortHaxxApp-unsigned.ipa
