name: Build TaskPortHaxxApp

on:
  push:
    branches: [ pacbf ]
  pull_request:

jobs:
  build:
    runs-on: macos-14

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Select Xcode version
        run: sudo xcode-select -s "/Applications/Xcode_16.1.app"

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Build TaskPortHaxxApp
        run: |
          xcodebuild \
            -project TaskPortHaxxApp.xcodeproj \
            -scheme TaskPortHaxxApp \
            -configuration Release \
            -sdk iphoneos \
            build CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package .ipa
        run: |
          mkdir -p Payload
          cp -r build/Release-iphoneos/TaskPortHaxxApp.app Payload/
          zip -r TaskPortHaxxApp.ipa Payload
          rm -rf Payload

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: TaskPortHaxxApp
          path: TaskPortHaxxApp.ipa
