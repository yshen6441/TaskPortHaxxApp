workflows:
  ios_nosign:
    name: Build iOS App Without Signing
    max_build_duration: 60  # 最大构建时长，单位为分钟

    environment:
      vars:
        FLUTTER: "/usr/local/bin/flutter"

    # 步骤：安装依赖
    scripts:
      - gem install fastlane

    # 步骤：构建 iOS 应用
      - xcodebuild -project TaskPortHaxxApp.xcodeproj -scheme TaskPortHaxxApp -configuration Release clean build CODE_SIGNING_REQUIRED=NO

    # 步骤：导出 .ipa 文件
      - xcodebuild -exportArchive -archivePath build/ios/TaskPortHaxxApp.xcarchive -exportPath build/ios/ipa/ -exportOptionsPlist ExportOptions.plist
