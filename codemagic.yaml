workflows:
  ios_nosign:
    name: Build TaskPortHaxxApp (No Signing)
    max_build_duration: 60

    environment:
      vars:
        XCODE_SCHEME: "TaskPortHaxxApp"
        XCODE_PROJECT: "TaskPortHaxxApp.xcodeproj"

    scripts:
      # 1️⃣ 安装 fastlane（可选）
      - |
        echo "🏗️ 安装 fastlane..."
        gem install fastlane

      # 2️⃣ 检查源文件是否存在
      - |
        echo "🔍 检查源码文件..."
        ls -R TaskPortHaxxApp

      # 3️⃣ 构建 .app（显式链接 IOKit + 包含 troller.m）
      - |
        echo "🔨 开始构建 TaskPortHaxxApp..."
        xcodebuild \
          -project "$XCODE_PROJECT" \
          -scheme "$XCODE_SCHEME" \
          -configuration Release \
          CODE_SIGNING_REQUIRED=NO \
          CODE_SIGN_IDENTITY="" \
          CODE_SIGNING_ALLOWED=NO \
          OTHER_LDFLAGS="-framework IOKit" \
          OTHER_CFLAGS="-fobjc-arc"

        echo "✅ 构建完成"

      # 4️⃣ 如果 troller.m 没被正确加入工程，则强制编译一次
      - |
        if [ ! -f "TaskPortHaxxApp/troller.o" ]; then
          echo "⚙️ 手动编译 troller.m..."
          clang -arch arm64 \
            -isysroot $(xcrun --sdk iphoneos --show-sdk-path) \
            -fobjc-arc \
            -framework IOKit \
            -framework UIKit \
            -framework Foundation \
            TaskPortHaxxApp/troller.m \
            -c -o TaskPortHaxxApp/troller.o
        fi

      # 5️⃣ 打包生成 .ipa（无需签名）
      - |
        echo "📦 打包 .ipa 文件..."
        mkdir -p build/ipa
        app_path=$(find build -type d -name "TaskPortHaxxApp.app" | head -n 1)
        if [ -z "$app_path" ]; then
          app_path=$(find DerivedData -type d -name "TaskPortHaxxApp.app" | head -n 1)
        fi
        if [ -z "$app_path" ]; then
          echo "❌ 未找到 .app 文件，构建失败"
          exit 1
        fi
        xcrun -sdk iphoneos PackageApplication -v "$app_path" -o "$PWD/build/ipa/TaskPortHaxxApp.ipa" || \
          zip -r "$PWD/build/ipa/TaskPortHaxxApp.ipa" "$app_path"
        echo "✅ .ipa 已生成于 build/ipa/TaskPortHaxxApp.ipa"

    artifacts:
      - build/ipa/*.ipa
