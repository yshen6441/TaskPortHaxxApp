workflows:
  ios-unsigned-build:
    name: Build Unsigned iOS IPA
    max_build_duration: 120
    instance_type: mac_mini_m2  # Or mac_pro for faster builds
    environment:
      xcode: latest  # Try a specific version if needed, e.g., 14.3 for older compatibility: xcode: 14.3
    scripts:
      - name: Debug info for troubleshooting
        script: |
          set -x
          echo "Listing all files:"
          ls -laR
          echo "Searching for Xcode files:"
          find . -name "*.xcodeproj" -o -name "*.xcworkspace" -o -name "Podfile" -o -name "Makefile" -o -name "*.sh"
          if [ -f "Podfile" ]; then
            echo "Podfile found - installing pods"
            pod install
            echo "Listing schemes from workspace:"
            xcodebuild -list -workspace $(find . -name "*.xcworkspace" | head -1)
          else
            echo "No Podfile - assuming project file"
            echo "Listing schemes from project:"
            xcodebuild -list -project $(find . -name "*.xcodeproj" | head -1)
          fi
          # If Makefile exists, show its contents for reference
          if [ -f "Makefile" ] || [ -n "$(find . -name 'Makefile')" ]; then
            echo "Makefile found - contents:"
            cat $(find . -name "Makefile" | head -1)
          fi
          # If .sh files exist, list them
          sh_files=$(find . -name "*.sh")
          if [ -n "$sh_files" ]; then
            echo "Shell scripts found: $sh_files"
          fi
      - name: Build unsigned (pre-archive step for isolation)
        script: |
          set -x
          xcodebuild build -project "TaskPortHaxxApp.xcodeproj" -scheme "TaskPortHaxxApp" -sdk iphoneos -configuration Release CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGNING_ALLOWED="NO" -verbose
      - name: Build unsigned archive
        script: |
          set -x
          # Uncomment below if debug shows a Makefile or .sh – replace with actual path/name
          # make all || sh path/to/build.sh
          xcodebuild archive -project "TaskPortHaxxApp.xcodeproj" -scheme "TaskPortHaxxApp" -sdk iphoneos -configuration Release -archivePath "$CM_BUILD_DIR/app.xcarchive" CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED="NO" CODE_SIGNING_ALLOWED="NO" -verbose
      - name: Export unsigned IPA
        script: |
          set -x
          cat <<EOF > unsigned.plist
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
              <key>compileBitcode</key>
              <false/>
              <key>method</key>
              <string>development</string>
          </dict>
          </plist>
          EOF
          xcodebuild -exportArchive -archivePath "$CM_BUILD_DIR/app.xcarchive" -exportPath "$CM_BUILD_DIR/unsigned_ipa" -exportOptionsPlist unsigned.plist -verbose
    artifacts:
      - $CM_BUILD_DIR/unsigned_ipa/*.ipa  # The resulting IPA file
      - /tmp/xcodebuild_logs/*.log  # Logs for debugging
